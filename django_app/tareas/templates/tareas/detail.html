<h2>{{ tarea.titulo }}</h2>
<p>Categoría: {{ tarea.categoria }}</p>
<p>{{ tarea.descripcion }}</p>
<p>Fecha límite: {{ tarea.fecha_limite }}</p>
{% if tarea.completada %}
    <p>✅ Completada</p>
{% else %}
    <p>Pendiente</p>
{% endif %}

<a href="{% url 'editar' tarea.id %}">Editar</a> |
<a href="{% url 'eliminar' tarea.id %}">Eliminar</a> |
<a href="{% url 'index' %}">Volver</a>
