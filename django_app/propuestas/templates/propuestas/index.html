<h1>Propuestas Universitarias</h1>
<a href="{% url 'propuestas:crear' %}">Crear nueva propuesta</a>
{% if propuestas %}
    <ul>
    {% for propuesta in propuestas %}
        <li>
            <a href="{% url 'propuestas:detalle' propuesta.id %}">{{ propuesta.titulo }}</a>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No hay propuestas registradas.</p>
{% endif %}
